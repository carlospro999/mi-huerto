<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi huerto</title>
<meta name="theme-color" content="#0e1f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi huerto">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&family=Lato:wght@400;700&display=swap">
</head>
<body>
<style>
/* Layout: una sola columna de móvil (máx. 560px) con barra de pestañas fija abajo; tarjetas oscuras sobre verde bosque, como el cuaderno impreso */
:root {
  --bg: #0e1f1a;
  --card: #16302a;
  --card2: #1c3a32;
  --line: #2c4a40;
  --cream: #f3ebdd;
  --muted: #8fa597;
  --blush: #e9b8a4;
  --tomato: #c8553d;
  --gold: #c2a46b;
  --warn: #e0a24a;
  --ok: #8fbf8a;
  --f-display: "Cormorant Garamond", Cambria, Georgia, serif;
  --f-script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --f-body: "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--cream); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: 120px;
  display: flex; flex-direction: column; gap: 22px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.brand .script { font-family: var(--f-script); color: var(--gold); font-size: 22px; line-height: 1; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 30px; margin: 2px 0 0; line-height: 1.05; text-wrap: balance; }
.seal { width: 54px; height: 54px; flex: none; }
.eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 0; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; margin: 4px 0 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }

.banner {
  background: var(--card); border: 1px dashed var(--gold); border-radius: 14px; padding: 12px 14px;
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.banner p { margin: 0; font-size: 13.5px; color: var(--cream); flex: 1 1 200px; }
.banner b { color: var(--gold); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--card); border-radius: 14px; padding: 12px; }
.stat .v { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }

.plants { display: flex; flex-direction: column; gap: 10px; }
.plant {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
  background: var(--card); border: 1px solid transparent; border-radius: 16px; padding: 12px; text-align: left; width: 100%;
}
.plant:hover { border-color: var(--line); }
.plant .ico { width: 52px; height: 52px; }
.plant .name { font-family: var(--f-display); font-size: 20px; font-weight: 600; line-height: 1.1; }
.plant .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: var(--card2); color: var(--cream); border: 1px solid var(--line); white-space: nowrap;
}
.chip.stage { color: var(--blush); }
.chip.alert { color: var(--warn); border-color: rgba(224,162,74,.45); }

.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 14.5px;
  background: var(--card2); color: var(--cream);
}
.btn.primary { background: var(--tomato); color: #fff8f0; }
.btn.gold { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { background: transparent; color: #f0a08f; border: 1px solid rgba(240,160,143,.45); }
.btn:disabled { opacity: .5; }

.fab {
  position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 20;
  background: var(--tomato); color: #fff8f0; border: 0; border-radius: 999px; padding: 15px 20px;
  font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}
.fab svg { width: 20px; height: 20px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: rgba(14,31,26,.96); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  backdrop-filter: blur(8px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button {
  background: none; border: 0; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--muted); font-size: 11.5px; letter-spacing: .04em;
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--gold); }

.list { display: flex; flex-direction: column; gap: 10px; }
.entry { background: var(--card); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.entry .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.entry .date { font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.entry .who { font-size: 12.5px; color: var(--muted); }
.entry .vals { display: flex; flex-wrap: wrap; gap: 6px; }
.entry .notes { font-size: 13.5px; color: var(--cream); font-style: italic; opacity: .9; }
.entry .acts { display: flex; gap: 8px; justify-content: flex-end; }
.entry .acts button { background: none; border: 0; color: var(--muted); font-size: 12.5px; padding: 4px 6px; }
.empty { background: var(--card); border-radius: 16px; padding: 22px 18px; text-align: center; color: var(--muted); }
.empty h3 { font-family: var(--f-display); color: var(--cream); font-size: 21px; margin: 6px 0; }

.chart { background: var(--card); border-radius: 16px; padding: 14px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.back { background: none; border: 0; color: var(--gold); font-size: 14px; padding: 0; display: inline-flex; align-items: center; gap: 4px; }

.guide { display: flex; flex-direction: column; gap: 10px; }
.tip { background: var(--card); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.tip .n { font-family: var(--f-display); font-size: 26px; color: var(--gold); line-height: 1; }
.tip h4 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.tip p { margin: 4px 0 0; font-size: 13.5px; color: var(--cream); opacity: .92; }
.tip .k { color: var(--blush); font-weight: 700; }

.panel { background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel p { margin: 0; font-size: 13.5px; color: var(--cream); opacity: .92; }
.panel .btns { display: flex; gap: 8px; flex-wrap: wrap; }
textarea.io { width: 100%; min-height: 90px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; }

/* hoja de anotación */
.sheet-bg { position: fixed; inset: 0; background: rgba(4,10,8,.6); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92%; overflow-y: auto;
  background: var(--bg); border-top: 1px solid var(--gold); border-radius: 22px 22px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 18px);
}
.sheet .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 0; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label, .field > .lab { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea {
  width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px;
}
.field textarea { min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 14px; font-size: 14px; color: var(--cream);
}
.opt[aria-pressed="true"] { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 700; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.stepper button { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 22px; }
.stepper input { text-align: center; font-size: 20px !important; font-family: var(--f-display); font-weight: 600; }
.hint { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: rgba(224,162,74,.12); color: var(--warn); }
.hint.good { background: rgba(143,191,138,.12); color: var(--ok); }
.sheet-acts { display: flex; gap: 10px; }
.sheet-acts .btn { flex: 1; }
.confirm { display: flex; flex-direction: column; gap: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); z-index: 60;
  background: var(--cream); color: #13221c; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 13.5px;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
}
.install { background: var(--card); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.install img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
.install p { margin: 0; font-size: 13.5px; flex: 1; }
.install b { color: var(--gold); }
.install .x { background: none; border: 0; color: var(--muted); font-size: 20px; padding: 4px 8px; }
.share-ico { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <span class="script">Los Cinco Grandes</span>
      <h1 id="viewTitle">Mi huerto</h1>
    </div>
    <svg class="seal" viewBox="0 0 60 60" aria-hidden="true">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8d29a"/><stop offset=".55" stop-color="#b8924f"/><stop offset="1" stop-color="#7d5f2d"/></linearGradient>
      <radialGradient id="tg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ee8b68"/><stop offset=".6" stop-color="#bd472f"/><stop offset="1" stop-color="#6e2418"/></radialGradient></defs>
      <circle cx="30" cy="30" r="28" fill="url(#sg)" stroke="#6b4f22" stroke-width="1.2"/>
      <circle cx="30" cy="30" r="22" fill="none" stroke="#6b4f22" stroke-width=".8"/>
      <ellipse cx="30" cy="33" rx="11" ry="9.5" fill="url(#tg)" stroke="#231c14" stroke-width="1"/>
      <path d="M30 25 l-5 -2 m5 2 l5 -2 m-5 2 l-2 -4 m2 4 l3 -4 m-3 4 v-3" stroke="#3d5a2e" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </header>
  <main id="view" class="wrap-inner" style="display:flex;flex-direction:column;gap:22px"></main>
</div>

<button class="fab" id="fab" type="button" aria-label="Nueva anotación">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Anotar
</button>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button type="button" data-tab="huerto" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 7-7 0 4-3 7-7 7z"/><path d="M12 15c0-3-2.5-5.5-6-5.5 0 3 2.5 5.5 6 5.5z"/><path d="M5 21h14"/></svg>
      Huerto
    </button>
    <button type="button" data-tab="diario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a2 2 0 0 1 2 2v16H8a2 2 0 0 1-2-2z"/><path d="M6 19a2 2 0 0 1 2-2h11"/><path d="M10 8h6M10 12h4"/></svg>
      Diario
    </button>
    <button type="button" data-tab="guia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6.5"/><path d="M12 7.5c0-2 1-3.5 3-4.5M12 7.5c-1.5-1.5-3.5-1.8-5-1"/><path d="M9.5 12.5c.8-1 2-1.5 3-1.4"/></svg>
      Guía
    </button>
    <button type="button" data-tab="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      Copia
    </button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var KEY = "cinco-grandes-cuaderno-v1";
  var VARIETIES = [
    { v: "Rosa de Barbastro", c: "pink" },
    { v: "Corazón de Buey", c: "red" },
    { v: "Muchamiel", c: "muchamiel" },
    { v: "Brandywine Rosa", c: "pink" },
    { v: "Marmande", c: "red" }
  ];
  var STAGES = ["Crecimiento", "Floración", "Cuaje", "Engorde", "Cosecha"];
  var ISSUES = ["Ninguna", "Plagas", "Hojas manchadas", "Rajado", "Podredumbre apical", "Otra"];
  var PAL = {
    pink: ["#f6c1ad", "#dc8070", "#8e3e36"],
    red: ["#ee8b68", "#bd472f", "#6e2418"],
    muchamiel: ["#e0c06a", "#c4583a", "#6e2418"]
  };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  function fmtDate(iso) { var p = iso.split("-"); return parseInt(p[2], 10) + " " + MESES[parseInt(p[1], 10) - 1] + " " + p[0]; }
  function fmtShort(iso) { var p = iso.split("-"); return parseInt(p[2], 10) + " " + MESES[parseInt(p[1], 10) - 1]; }
  function num(x) { var n = parseFloat(String(x).replace(",", ".")); return isFinite(n) ? n : null; }
  function fmtNum(n) { return n == null ? "–" : String(Math.round(n * 10) / 10).replace(".", ","); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function examples() {
    var plants = VARIETIES.map(function (x, i) { return { id: "p" + (i + 1), variety: x.v, place: "Bancal " + (i < 3 ? "1" : "2") + " · posición " + ((i % 3) + 1), color: x.c }; });
    var t = today();
    var e = [
      { plantId: "p1", d: -6, w: 2.5, tx: 29, tn: 17, st: "Floración", is: "Ninguna", n: "Primer racimo abierto" },
      { plantId: "p1", d: -3, w: 3, tx: 33, tn: 19, st: "Floración", is: "Ninguna", n: "Día de calor: algunas flores secas" },
      { plantId: "p1", d: 0, w: 3, tx: 30, tn: 18, st: "Cuaje", is: "Ninguna", n: "Tres frutos cuajados" },
      { plantId: "p5", d: -2, w: 2, tx: 31, tn: 18, st: "Engorde", is: "Plagas", n: "Pulgón en brotes tiernos: jabón potásico" },
      { plantId: "p2", d: -1, w: 3.5, tx: 30, tn: 17, st: "Floración", is: "Ninguna", n: "" }
    ].map(function (x) { return { id: uid(), plantId: x.plantId, date: addDays(t, x.d), water: x.w, tmax: x.tx, tmin: x.tn, stage: x.st, issue: x.is, notes: x.n }; });
    return { plants: plants, entries: e, example: true };
  }

  var mem = null;
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (s && s.plants && s.entries) return s; } } catch (e) {}
    return examples();
  }
  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { mem = S; } }

  var ui = { tab: "huerto", plant: null };

  function plantById(id) { for (var i = 0; i < S.plants.length; i++) if (S.plants[i].id === id) return S.plants[i]; return null; }
  function entriesOf(id) { return S.entries.filter(function (e) { return !id || e.plantId === id; }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }); }

  function tomato(color, size) {
    var c = PAL[color] || PAL.red, gid = "t" + Math.random().toString(36).slice(2, 8);
    return '<svg class="ico" viewBox="0 0 52 52" width="' + (size || 52) + '" height="' + (size || 52) + '" aria-hidden="true"><defs><radialGradient id="' + gid + '" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="' + c[0] + '"/><stop offset=".6" stop-color="' + c[1] + '"/><stop offset="1" stop-color="' + c[2] + '"/></radialGradient></defs>' +
      '<circle cx="26" cy="26" r="25" fill="#1c3a32"/>' +
      '<path d="M26 16c9 0 15 5 15 12 0 8-7 13-15 13s-15-5-15-13c0-7 6-12 15-12z" fill="url(#' + gid + ')" stroke="#231c14" stroke-width="1.2"/>' +
      '<path d="M26 18c-4 2-6 9-5 22M26 18c4 2 6 9 5 22M26 18c-8 1-12 8-12 13M26 18c8 1 12 8 12 13" fill="none" stroke="' + c[2] + '" stroke-width="1" opacity=".45"/>' +
      '<ellipse cx="20" cy="23" rx="4" ry="2" fill="#fff" opacity=".45" transform="rotate(-25 20 23)"/>' +
      '<path d="M26 18l-6-2m6 2l6-2m-6 2l-3-5m3 5l4-5m-4 5v-5" stroke="#557a43" stroke-width="2.2" stroke-linecap="round"/></svg>';
  }

  function hintsFor(e) {
    var h = [];
    if (e.tmax != null && e.tmax > 32) h.push("Más de 32 °C: las flores pueden caer sin cuajar. Riega por la mañana y da algo de sombra.");
    if (e.tmin != null && e.tmin < 13) h.push("Noche por debajo de 13 °C: el cuaje irá lento.");
    if (e.issue === "Podredumbre apical") h.push("Suele deberse a un riego irregular: mantén la humedad constante.");
    if (e.issue === "Rajado") h.push("El rajado aparece al regar mucho tras días secos: riega poco y a menudo.");
    if (e.issue === "Plagas") h.push("Revisa el envés de las hojas dos veces por semana.");
    return h;
  }

  // ---------- instalar en pantalla de inicio
  var deferredPrompt = null;
  function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function installDismissed() { try { return localStorage.getItem(KEY + "-noinstall") === "1"; } catch (e) { return false; } }
  function installBanner() {
    if (isStandalone() || installDismissed()) return "";
    var shareIco = '<svg class="share-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>';
    if (isIOS()) return '<div class="install"><img src="apple-touch-icon.png" alt=""><p><b>Tenla como app:</b> toca ' + shareIco + ' <b>Compartir</b> y luego <b>«Añadir a pantalla de inicio»</b>.</p><button class="x" type="button" data-act="hide-install" aria-label="Cerrar">×</button></div>';
    if (deferredPrompt) return '<div class="install"><img src="icon-192.png" alt=""><p><b>Instala el cuaderno</b> en tu pantalla de inicio.</p><button class="btn primary" type="button" data-act="install">Instalar</button></div>';
    return "";
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredPrompt = e; if (ui.tab === "huerto" && !ui.plant) render(); });
  window.addEventListener("appinstalled", function () { deferredPrompt = null; render(); });

  // ---------- vistas
  function vHuerto() {
    if (ui.plant) return vPlanta(plantById(ui.plant));
    var all = entriesOf(null);
    var litros = all.reduce(function (s, e) { return s + (e.water || 0); }, 0);
    var alerts = all.filter(function (e) { return hintsFor(e).length; }).length;
    var h = installBanner();
    if (S.example) h += '<div class="banner"><p><b>Datos de ejemplo.</b> Así se verá tu cuaderno con anotaciones. Bórralos cuando empieces tu temporada.</p><button class="btn gold" type="button" data-act="clear-examples">Empezar de cero</button></div>';
    h += '<section><p class="eyebrow">Temporada ' + new Date().getFullYear() + '</p><h2>Tus cinco tomateras</h2><p class="sub">Toca una planta para ver su historial.</p></section>';
    h += '<div class="stats"><div class="stat"><div class="v">' + all.length + '</div><div class="l">Anotaciones</div></div><div class="stat"><div class="v">' + fmtNum(litros) + '</div><div class="l">Litros regados</div></div><div class="stat"><div class="v">' + alerts + '</div><div class="l">Avisos</div></div></div>';
    h += '<div class="plants">';
    S.plants.forEach(function (p) {
      var es = entriesOf(p.id), last = es[0];
      var meta = last ? "Última visita: " + fmtShort(last.date) : "Sin anotaciones todavía";
      h += '<button type="button" class="plant" data-plant="' + p.id + '">' + tomato(p.color) +
        '<div style="min-width:0"><div class="name">' + esc(p.variety) + '</div><div class="meta">' + esc(p.place || "") + (p.place ? " · " : "") + meta + '</div></div>' +
        (last ? '<span class="chip stage">' + esc(last.stage) + '</span>' : '<span class="chip">Nueva</span>') + '</button>';
    });
    h += '</div>';
    return h;
  }

  function chart(es) {
    var pts = es.slice(0, 14).reverse();
    if (pts.length < 2) return '<div class="chart"><p class="sub" style="margin:0">El gráfico aparecerá cuando tengas al menos dos anotaciones.</p></div>';
    var W = 520, H = 200, L = 34, R = 34, T = 14, B = 30;
    var n = pts.length, step = (W - L - R) / (n - 1);
    var tmax = 40, tmin = 0, wmax = Math.max(5, Math.ceil(Math.max.apply(null, pts.map(function (p) { return p.water || 0; }))));
    function yT(v) { return T + (H - T - B) * (1 - (v - tmin) / (tmax - tmin)); }
    function yW(v) { return T + (H - T - B) * (1 - v / wmax); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Riego y temperaturas de las últimas anotaciones">';
    [0, 10, 20, 30, 40].forEach(function (v) { s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yT(v) + '" y2="' + yT(v) + '" stroke="#2c4a40" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (yT(v) + 4) + '" fill="#8fa597" font-size="11" text-anchor="end">' + v + '°</text>'; });
    s += '<text x="' + (W - R + 6) + '" y="' + (T + 4) + '" fill="#c2a46b" font-size="11">' + wmax + ' L</text><text x="' + (W - R + 6) + '" y="' + (H - B + 4) + '" fill="#c2a46b" font-size="11">0 L</text>';
    s += '<rect x="' + L + '" y="' + yT(27) + '" width="' + (W - L - R) + '" height="' + (yT(18) - yT(27)) + '" fill="#8fbf8a" opacity=".08"/>';
    pts.forEach(function (p, i) {
      var x = L + i * step, bw = Math.min(18, step * 0.5);
      if (p.water != null) s += '<rect x="' + (x - bw / 2) + '" y="' + yW(p.water) + '" width="' + bw + '" height="' + (H - B - yW(p.water)) + '" rx="3" fill="#c2a46b" opacity=".5"/>';
      if (i % Math.ceil(n / 6) === 0 || i === n - 1) s += '<text x="' + x + '" y="' + (H - 10) + '" fill="#8fa597" font-size="11" text-anchor="middle">' + fmtShort(p.date) + '</text>';
    });
    function line(key, col) {
      var d = "", dots = "";
      pts.forEach(function (p, i) { if (p[key] == null) return; var x = L + i * step, y = yT(p[key]); d += (d ? "L" : "M") + x + "," + y; dots += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + col + '"/>'; });
      return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.2" stroke-linejoin="round"/>' + dots;
    }
    s += line("tmax", "#c8553d") + line("tmin", "#9fc3cf") + '</svg>';
    return '<div class="chart">' + s + '<div class="legend"><span><i style="background:#c8553d"></i>Máxima</span><span><i style="background:#9fc3cf"></i>Mínima</span><span><i style="background:#c2a46b;opacity:.6"></i>Riego</span><span><i style="background:#8fbf8a;opacity:.4"></i>18–27 °C, cuaje óptimo</span></div></div>';
  }

  function entryCard(e, showPlant) {
    var p = plantById(e.plantId), hs = hintsFor(e);
    var v = '<span class="chip stage">' + esc(e.stage || "–") + '</span>';
    if (e.water != null) v += '<span class="chip">Riego ' + fmtNum(e.water) + ' L</span>';
    if (e.tmax != null || e.tmin != null) v += '<span class="chip">' + fmtNum(e.tmax) + ' / ' + fmtNum(e.tmin) + ' °C</span>';
    if (e.issue && e.issue !== "Ninguna") v += '<span class="chip alert">' + esc(e.issue) + '</span>';
    return '<article class="entry"><div class="row1"><span class="date">' + fmtDate(e.date) + '</span>' + (showPlant && p ? '<span class="who">' + esc(p.variety) + '</span>' : "") + '</div>' +
      '<div class="vals">' + v + '</div>' + (e.notes ? '<div class="notes">' + esc(e.notes) + '</div>' : "") +
      (hs.length ? '<div class="hint">' + esc(hs[0]) + '</div>' : "") +
      '<div class="acts"><button type="button" data-edit="' + e.id + '">Editar</button><button type="button" data-del="' + e.id + '">Borrar</button></div></article>';
  }

  function vPlanta(p) {
    if (!p) { ui.plant = null; return vHuerto(); }
    var es = entriesOf(p.id);
    var litros = es.reduce(function (s, e) { return s + (e.water || 0); }, 0);
    var days = es.length ? Math.round((new Date(es[0].date) - new Date(es[es.length - 1].date)) / 864e5) + 1 : 0;
    var h = '<button type="button" class="back" data-act="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>Todas las plantas</button>';
    h += '<section style="display:flex;gap:14px;align-items:center">' + tomato(p.color, 64) + '<div style="min-width:0"><p class="eyebrow">Planta</p><h2 style="margin:0">' + esc(p.variety) + '</h2><p class="sub">' + esc(p.place || "") + '</p></div></section>';
    h += '<div class="stats"><div class="stat"><div class="v">' + es.length + '</div><div class="l">Anotaciones</div></div><div class="stat"><div class="v">' + fmtNum(litros) + '</div><div class="l">Litros</div></div><div class="stat"><div class="v">' + days + '</div><div class="l">Días de registro</div></div></div>';
    h += chart(es);
    h += '<div class="field"><label for="place">Ubicación de la planta</label><input id="place" type="text" value="' + esc(p.place || "") + '" placeholder="Por ejemplo: bancal 1, junto al muro"></div>';
    h += '<section class="list">' + (es.length ? es.map(function (e) { return entryCard(e, false); }).join("") : '<div class="empty"><h3>Aún sin anotaciones</h3><p>Pulsa «Anotar» después de cada visita al huerto.</p></div>') + '</section>';
    return h;
  }

  function vDiario() {
    var es = entriesOf(null);
    var h = '<section><p class="eyebrow">Todas las plantas</p><h2>Diario del huerto</h2><p class="sub">Las anotaciones más recientes, primero.</p></section>';
    h += es.length ? '<section class="list">' + es.map(function (e) { return entryCard(e, true); }).join("") + '</section>' : '<div class="empty"><h3>El diario está vacío</h3><p>Tu primera anotación aparecerá aquí.</p></div>';
    return h;
  }

  var GUIDE = [
    ["Riego", "Constante y por la mañana, sin mojar las hojas. En pleno verano, <span class='k'>2 – 4 L por planta y día</span>. Prueba del dedo: si está seco a 5 cm, toca regar."],
    ["Temperatura", "El cuaje es óptimo entre <span class='k'>18 y 27 °C</span> de día. Por encima de 32 °C la flor puede caer; noches bajo 13 °C, cuaje lento."],
    ["Poda", "Quita los <span class='k'>chupones con 3 – 5 cm</span>, a mano y por la mañana. Despunta a finales de agosto."],
    ["Tutorado", "Ata en ocho, flojo, <span class='k'>cada 25 – 30 cm</span>. Tutor de 2 – 2,5 m para las indeterminadas."],
    ["Abonado", "Compost de fondo; en floración y engorde, más <span class='k'>potasio</span>. Mucho nitrógeno da hoja y poco fruto."],
    ["Plagas", "Revisa el <span class='k'>envés de las hojas</span> dos veces por semana. Jabón potásico para pulgón y mosca blanca."],
    ["Cosecha", "Por la mañana y con tijera. <span class='k'>Nunca en nevera</span>: por debajo de 12 °C pierde aroma."]
  ];
  function vGuia() {
    var h = '<section><p class="eyebrow">Cuaderno de bolsillo</p><h2>Guía rápida</h2><p class="sub">Las cifras clave de las láminas, siempre a mano.</p></section><div class="guide">';
    GUIDE.forEach(function (g, i) { h += '<div class="tip"><div class="n">' + ["I", "II", "III", "IV", "V", "VI", "VII"][i] + '</div><div><h4>' + g[0] + '</h4><p>' + g[1] + '</p></div></div>'; });
    return h + '</div>';
  }

  function vAjustes() {
    var h = '<section><p class="eyebrow">Tus datos</p><h2>Copia de seguridad</h2><p class="sub">Todo se guarda solo en este teléfono.</p></section>';
    h += '<div class="panel"><p>Guarda una copia de vez en cuando: si cambias de móvil o borras los datos del navegador, podrás recuperarla.</p><div class="btns"><button class="btn primary" type="button" data-act="export-json">Guardar copia</button><button class="btn gold" type="button" data-act="export-csv">Exportar a Excel</button></div></div>';
    h += '<div class="panel"><p>Para restaurar, elige el archivo de copia o pega su contenido.</p><div class="btns"><label class="btn" for="importFile" style="display:inline-block">Elegir archivo</label><input id="importFile" type="file" accept=".json,application/json,text/plain" hidden></div><textarea class="io" id="importText" placeholder="O pega aquí el texto de la copia"></textarea><div class="btns"><button class="btn gold" type="button" data-act="import-text">Restaurar desde el texto</button></div></div>';
    h += '<div class="panel" id="copyPanel" hidden><p>Tu teléfono no permite guardar archivos desde aquí. Copia este texto y guárdalo en una nota o envíatelo:</p><textarea class="io" id="exportText" readonly></textarea><div class="btns"><button class="btn gold" type="button" data-act="copy-export">Copiar texto</button></div></div>';
    h += '<div class="panel"><p>Borrar todas las anotaciones de este teléfono. Las cinco plantas se mantienen.</p><div class="btns"><button class="btn danger" type="button" data-act="ask-wipe">Borrar anotaciones</button></div><div id="wipeConfirm" hidden class="confirm"><p><b>¿Seguro?</b> No se puede deshacer.</p><div class="btns"><button class="btn danger" type="button" data-act="wipe">Sí, borrar todo</button><button class="btn ghost" type="button" data-act="cancel-wipe">Cancelar</button></div></div></div>';
    return h;
  }

  function render() {
    var view = document.getElementById("view");
    var map = { huerto: vHuerto, diario: vDiario, guia: vGuia, ajustes: vAjustes };
    view.innerHTML = map[ui.tab]();
    document.getElementById("viewTitle").textContent = { huerto: "Mi huerto", diario: "Diario", guia: "Guía", ajustes: "Copia" }[ui.tab];
    document.querySelectorAll("nav.tabs button").forEach(function (b) { if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    document.getElementById("fab").hidden = ui.tab === "ajustes" || ui.tab === "guia";
    var place = document.getElementById("place");
    if (place) place.addEventListener("change", function () { var p = plantById(ui.plant); if (p) { p.place = place.value.trim(); save(); toast("Ubicación guardada"); } });
    var f = document.getElementById("importFile");
    if (f) f.addEventListener("change", function () { var file = f.files && f.files[0]; if (!file) return; var r = new FileReader(); r.onload = function () { doImport(String(r.result)); }; r.readAsText(file); });
  }

  // ---------- hoja de anotación
  var draft = null;
  function openSheet(entry) {
    draft = entry ? JSON.parse(JSON.stringify(entry)) : { id: null, plantId: ui.plant || (S.plants[0] && S.plants[0].id), date: today(), water: 2, tmax: null, tmin: null, stage: "Crecimiento", issue: "Ninguna", notes: "" };
    if (!entry) { var last = entriesOf(draft.plantId)[0]; if (last) { draft.stage = last.stage; draft.water = last.water; } }
    drawSheet();
  }
  function opts(list, cur, name) { return list.map(function (o) { return '<button type="button" class="opt" data-' + name + '="' + esc(o) + '" aria-pressed="' + (o === cur) + '">' + esc(o) + '</button>'; }).join(""); }
  function drawSheet() {
    var d = draft;
    var plantOpts = S.plants.map(function (p) { return '<option value="' + p.id + '"' + (p.id === d.plantId ? " selected" : "") + '>' + esc(p.variety) + '</option>'; }).join("");
    var hs = hintsFor(d);
    var html = '<div class="sheet-bg" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="in"><div class="grab"></div>' +
      '<div><p class="eyebrow">' + (d.id ? "Editar anotación" : "Nueva anotación") + '</p><h2 id="sheetTitle" style="margin:2px 0 0">Visita al huerto</h2></div>' +
      '<div class="two"><div class="field"><label for="fPlant">Planta</label><select id="fPlant">' + plantOpts + '</select></div><div class="field"><label for="fDate">Fecha</label><input id="fDate" type="date" value="' + d.date + '"></div></div>' +
      '<div class="field"><label for="fWater">Riego (litros)</label><div class="stepper"><button type="button" data-step="-0.5" aria-label="Menos agua">−</button><input id="fWater" type="number" inputmode="decimal" step="0.5" min="0" value="' + (d.water == null ? "" : d.water) + '"><button type="button" data-step="0.5" aria-label="Más agua">+</button></div></div>' +
      '<div class="two"><div class="field"><label for="fTmax">T.ª máx. (°C)</label><input id="fTmax" type="number" inputmode="decimal" value="' + (d.tmax == null ? "" : d.tmax) + '" placeholder="28"></div><div class="field"><label for="fTmin">T.ª mín. (°C)</label><input id="fTmin" type="number" inputmode="decimal" value="' + (d.tmin == null ? "" : d.tmin) + '" placeholder="16"></div></div>' +
      '<div class="field"><span class="lab">Estado de la planta</span><div class="opts">' + opts(STAGES, d.stage, "stage") + '</div></div>' +
      '<div class="field"><span class="lab">Plagas o incidencias</span><div class="opts">' + opts(ISSUES, d.issue, "issue") + '</div></div>' +
      '<div class="field"><label for="fNotes">Observaciones</label><textarea id="fNotes" placeholder="Primer racimo, frutos cuajados, poda…">' + esc(d.notes) + '</textarea></div>' +
      '<div id="sheetHints">' + (hs.length ? hs.map(function (x) { return '<div class="hint" style="margin-bottom:6px">' + esc(x) + '</div>'; }).join("") : "") + '</div>' +
      '<div class="sheet-acts"><button class="btn ghost" type="button" data-act="close">Cancelar</button><button class="btn primary" type="button" data-act="save-entry">Guardar anotación</button></div></div></div>';
    document.getElementById("sheetRoot").innerHTML = html;
    ["fPlant", "fDate", "fWater", "fTmax", "fTmin", "fNotes"].forEach(function (id) { var el = document.getElementById(id); el.addEventListener("input", readSheet); });
  }
  function readSheet() {
    draft.plantId = document.getElementById("fPlant").value;
    draft.date = document.getElementById("fDate").value || today();
    draft.water = num(document.getElementById("fWater").value);
    draft.tmax = num(document.getElementById("fTmax").value);
    draft.tmin = num(document.getElementById("fTmin").value);
    draft.notes = document.getElementById("fNotes").value.trim();
    var hs = hintsFor(draft), el = document.getElementById("sheetHints");
    if (el) el.innerHTML = hs.map(function (x) { return '<div class="hint" style="margin-bottom:6px">' + esc(x) + '</div>'; }).join("");
  }
  function closeSheet() { document.getElementById("sheetRoot").innerHTML = ""; draft = null; }

  function toast(msg) {
    var r = document.getElementById("toastRoot");
    r.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
    clearTimeout(toast.t); toast.t = setTimeout(function () { r.innerHTML = ""; }, 2200);
  }

  // ---------- copia de seguridad
  function payload() { return JSON.stringify({ app: "cinco-grandes", version: 1, savedAt: new Date().toISOString(), plants: S.plants, entries: S.entries }, null, 1); }
  function csv() {
    var rows = [["Fecha", "Variedad", "Ubicación", "Riego (L)", "T máx (°C)", "T mín (°C)", "Estado", "Incidencias", "Observaciones"]];
    entriesOf(null).slice().reverse().forEach(function (e) { var p = plantById(e.plantId) || {}; rows.push([e.date, p.variety || "", p.place || "", fmtNum(e.water), fmtNum(e.tmax), fmtNum(e.tmin), e.stage || "", e.issue || "", e.notes || ""]); });
    return "﻿" + rows.map(function (r) { return r.map(function (c) { c = String(c == null ? "" : c); return /[";\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(";"); }).join("\r\n");
  }
  var dl = null;
  function offer(filename, data) {
    var fallback = function () { var p = document.getElementById("copyPanel"); if (p) { p.hidden = false; document.getElementById("exportText").value = data; p.scrollIntoView({ block: "nearest" }); } };
    if (!dl) {
      var type = /\.csv$/.test(filename) ? "text/csv" : "application/json";
      try {
        var file = new File([data], filename, { type: type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: filename }).then(function () { toast("Copia guardada"); }).catch(function (err) { if (!err || err.name !== "AbortError") fallback(); });
          return;
        }
        if (!isStandalone()) {
          var a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = filename;
          document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          toast("Copia descargada"); return;
        }
      } catch (e) {}
      fallback(); return;
    }
    dl.save({ filename: filename, data: data }).then(function () { toast("Copia guardada"); }).catch(function (err) {
      if (err && err.code === "declined") return;
      if (err && err.code === "rate_limited") { toast("Espera un momento y vuelve a intentarlo"); return; }
      fallback();
    });
  }
  function doImport(text) {
    try {
      var o = JSON.parse(text);
      if (!o || !Array.isArray(o.plants) || !Array.isArray(o.entries)) throw new Error("x");
      S = { plants: o.plants, entries: o.entries, example: false }; save(); ui.plant = null; ui.tab = "huerto"; render();
      toast("Copia restaurada: " + o.entries.length + " anotaciones");
    } catch (e) { toast("Ese texto no es una copia válida del cuaderno"); }
  }

  // ---------- eventos
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button, .sheet-bg");
    if (!t) return;
    if (t.dataset.tab) { ui.tab = t.dataset.tab; ui.plant = null; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.plant) { ui.plant = t.dataset.plant; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.stage) { draft.stage = t.dataset.stage; t.parentNode.querySelectorAll(".opt").forEach(function (b) { b.setAttribute("aria-pressed", b === t); }); return; }
    if (t.dataset.issue) { draft.issue = t.dataset.issue; t.parentNode.querySelectorAll(".opt").forEach(function (b) { b.setAttribute("aria-pressed", b === t); }); readSheet(); return; }
    if (t.dataset.step) { var w = document.getElementById("fWater"); var v = Math.max(0, (num(w.value) || 0) + parseFloat(t.dataset.step)); w.value = v; readSheet(); return; }
    if (t.dataset.edit) { var e = S.entries.filter(function (x) { return x.id === t.dataset.edit; })[0]; if (e) openSheet(e); return; }
    if (t.dataset.del) {
      if (t.dataset.armed) { S.entries = S.entries.filter(function (x) { return x.id !== t.dataset.del; }); save(); render(); toast("Anotación borrada"); }
      else { t.dataset.armed = "1"; t.textContent = "¿Borrar? Toca otra vez"; t.style.color = "#f0a08f"; }
      return;
    }
    switch (t.dataset.act) {
      case "hide-install": try { localStorage.setItem(KEY + "-noinstall", "1"); } catch (e) {} render(); break;
      case "install": if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function () { deferredPrompt = null; render(); }); } break;
      case "back": ui.plant = null; render(); break;
      case "close": closeSheet(); break;
      case "save-entry":
        readSheet();
        if (draft.id) { S.entries = S.entries.map(function (x) { return x.id === draft.id ? draft : x; }); }
        else { draft.id = uid(); S.entries.push(draft); }
        save(); closeSheet(); render(); toast("Anotación guardada"); break;
      case "clear-examples": S = { plants: examples().plants.map(function (p) { p.place = ""; return p; }), entries: [], example: false }; save(); render(); toast("Cuaderno listo para tu temporada"); break;
      case "export-json": offer("cuaderno-huerto-" + today() + ".json", payload()); break;
      case "export-csv": offer("cuaderno-huerto-" + today() + ".csv", csv()); break;
      case "copy-export":
        var ta = document.getElementById("exportText");
        (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(function () { toast("Texto copiado"); }).catch(function () { ta.focus(); ta.select(); toast("Selecciona y copia el texto"); });
        break;
      case "import-text": doImport(document.getElementById("importText").value); break;
      case "ask-wipe": document.getElementById("wipeConfirm").hidden = false; break;
      case "cancel-wipe": document.getElementById("wipeConfirm").hidden = true; break;
      case "wipe": S.entries = []; S.example = false; save(); render(); toast("Anotaciones borradas"); break;
    }
  });
  document.getElementById("fab").addEventListener("click", function () { openSheet(null); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && draft) closeSheet(); });

  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (d) { dl = d; }).catch(function () { dl = null; });
  }
})();
</script>
</body>
</html>
